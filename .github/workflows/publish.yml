# SPDX-License-Identifier: Apache-2.0
name: Publish

# On a version tag (e.g. v0.2.0):
#   1. check the tag matches __version__, then build the sdist and wheel.
#   2. publish to PyPI via Trusted Publishing (OIDC) - no stored token.
#   3. create the GitHub Release from the matching CHANGELOG section.
#
# One-time PyPI setup: add a "pending publisher" at
# https://pypi.org/manage/account/publishing/ with:
#   PyPI project name = stille-hunter, owner = ForexRobotics,
#   repository = stille-hunter, workflow = publish.yml, environment = pypi
#
# Third-party actions are pinned to full commit SHAs so a moved or hijacked
# tag cannot change what runs here; Dependabot proposes updates. Runners are
# pinned too, so a change to ubuntu-latest cannot alter the release build.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match __version__
        run: |
          VERSION=$(python -c "import re, pathlib; t = pathlib.Path('src/stille_hunter/__init__.py').read_text(); print(re.search(r'__version__ = \"(.+?)\"', t).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches __version__."
      - name: Test before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: publish          # only create the release once the package is live
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Keep a Changelog: take "## [X.Y.Z] - date" up to the next "## [" or
          # the link references at the bottom.
          awk -v v="## [$VERSION]" \
            'index($0, v) == 1 {f = 1; next}
             f && /^## \[/ {exit}
             f && /^\[[^]]+\]: / {exit}
             f {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md." > notes.md
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: stille-hunter ${{ steps.notes.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file notes.md \
          || gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file notes.md
