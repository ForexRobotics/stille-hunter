<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="stille-hunter overview flow">
  <style>
    :root { color-scheme: light dark; }
    .bg      { fill: #ffffff; }
    .card    { fill: #f4f6f8; stroke: #cbd3da; stroke-width: 1.5; }
    .card-hi { fill: #eef3fb; stroke: #9db8e4; stroke-width: 1.5; }
    .card-al { fill: #fbeeee; stroke: #e0a3a3; stroke-width: 1.5; }
    .title   { fill: #1b2733; }
    .body    { fill: #4a5765; }
    .mono    { fill: #2d3a47; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .arrow   { stroke: #8a97a4; stroke-width: 2; fill: none; }
    .arrowhead { fill: #8a97a4; }
    .step    { fill: #7c8a99; }
    .phase   { fill: #9aa6b2; letter-spacing: .12em; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .bg      { fill: #0f1419; }
      :root:not([data-theme="light"]) .card    { fill: #1b222b; stroke: #38424d; }
      :root:not([data-theme="light"]) .card-hi { fill: #16202f; stroke: #3c5a86; }
      :root:not([data-theme="light"]) .card-al { fill: #2a1a1a; stroke: #7a4a4a; }
      :root:not([data-theme="light"]) .title   { fill: #e6edf3; }
      :root:not([data-theme="light"]) .body    { fill: #aab6c2; }
      :root:not([data-theme="light"]) .mono    { fill: #cdd6df; }
      :root:not([data-theme="light"]) .arrow   { stroke: #5c6773; }
      :root:not([data-theme="light"]) .arrowhead { fill: #5c6773; }
      :root:not([data-theme="light"]) .step    { fill: #7c8a99; }
      :root:not([data-theme="light"]) .phase   { fill: #68737f; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="860" height="460" rx="0"/>

  <!-- PHASE 1: PLANT -->
  <text class="phase" x="40" y="44" font-size="12" font-weight="700">PLANT</text>

  <!-- generate -->
  <rect class="card" x="40" y="60" width="200" height="88" rx="10"/>
  <text class="step" x="56" y="84" font-size="11" font-weight="700">1</text>
  <text class="title" x="56" y="104" font-size="15" font-weight="700">generate</text>
  <text class="body" x="56" y="124" font-size="12">Fake but realistic member</text>
  <text class="body" x="56" y="139" font-size="12">records, each with a unique token.</text>

  <!-- seed into data -->
  <rect class="card" x="40" y="188" width="200" height="74" rx="10"/>
  <text class="step" x="56" y="212" font-size="11" font-weight="700">2</text>
  <text class="title" x="56" y="232" font-size="14" font-weight="700">Plant the seeded data</text>
  <text class="body" x="56" y="251" font-size="12">into your DB / export / table.</text>

  <!-- ledger -->
  <rect class="card-hi" x="40" y="300" width="200" height="88" rx="10"/>
  <text class="title" x="56" y="324" font-size="14" font-weight="700">ledger (kept secret)</text>
  <text class="body" x="56" y="344" font-size="12">token → where it was planted.</text>
  <text class="body" x="56" y="359" font-size="12">Never committed, never planted.</text>
  <text class="mono" x="56" y="378" font-size="11">used to trace a leak back</text>

  <!-- arrow 1->2 -->
  <path class="arrow" d="M140,148 L140,186"/>
  <polygon class="arrowhead" points="140,188 136,180 144,180"/>
  <!-- generate also writes ledger -->
  <path class="arrow" d="M70,148 C58,210 58,250 70,300"/>
  <polygon class="arrowhead" points="70,300 63,294 73,296"/>

  <!-- LEAK (center) -->
  <path class="arrow" d="M240,225 L320,225"/>
  <polygon class="arrowhead" points="322,225 314,221 314,229"/>
  <rect class="card-al" x="324" y="192" width="150" height="66" rx="10"/>
  <text class="title" x="399" y="222" font-size="14" font-weight="700" text-anchor="middle">a breach happens</text>
  <text class="body" x="399" y="242" font-size="12" text-anchor="middle">your data leaks out</text>

  <!-- PHASE 2: DETECT -->
  <text class="phase" x="560" y="44" font-size="12" font-weight="700">DETECT — TWO PATHS</text>

  <!-- split from leak to two detect paths -->
  <path class="arrow" d="M474,215 C520,215 520,120 558,120"/>
  <polygon class="arrowhead" points="560,120 552,116 552,124"/>
  <path class="arrow" d="M474,235 C520,235 520,330 558,330"/>
  <polygon class="arrowhead" points="560,330 552,326 552,334"/>

  <!-- inbox detect -->
  <rect class="card-hi" x="560" y="78" width="260" height="92" rx="10"/>
  <text class="title" x="578" y="104" font-size="15" font-weight="700">inbox detection</text>
  <text class="body" x="578" y="126" font-size="12">Self-domain canaries. Mail sent to a</text>
  <text class="body" x="578" y="142" font-size="12">canary address hits your catch-all —</text>
  <text class="mono" x="578" y="160" font-size="11">fastest signal · detect=inbox</text>

  <!-- search detect -->
  <rect class="card-hi" x="560" y="286" width="260" height="92" rx="10"/>
  <text class="title" x="578" y="312" font-size="15" font-weight="700">search detection</text>
  <text class="body" x="578" y="334" font-size="12">check looks tokens up in leak sources</text>
  <text class="body" x="578" y="350" font-size="12">(HIBP, code search, …).</text>
  <text class="mono" x="578" y="368" font-size="11">covers free-mail · detect=search</text>

  <!-- alert -->
  <path class="arrow" d="M690,170 L690,205"/>
  <path class="arrow" d="M690,286 L690,251"/>
  <rect class="card-al" x="596" y="205" width="188" height="46" rx="10"/>
  <text class="title" x="690" y="227" font-size="14" font-weight="700" text-anchor="middle">LEAK CONFIRMED</text>
  <text class="body" x="690" y="244" font-size="11" text-anchor="middle">which seed_tag leaked · exit 1</text>

  <!-- footer tagline -->
  <text class="body" x="40" y="430" font-size="12" font-style="italic">Read-only, search-only. Sets a quiet trap and waits — it never touches anyone else's systems.</text>
</svg>
